<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title description">
  <title id="title">校伴品牌色</title>
  <desc id="description">海军蓝、青绿、暖橙、雾白。颜色数值与Android brand_colors资源一致。</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" fill="#172B49">
    <rect x="20" y="24" width="150" height="100" rx="16" fill="#172B49" stroke="#172B49" stroke-opacity="0.12" />
    <text x="20" y="151" font-size="16" font-weight="600">海军蓝</text>
    <text x="20" y="175" font-size="13">brand_navy</text>
    <text x="20" y="198" font-size="14">#172B49</text>
    <rect x="190" y="24" width="150" height="100" rx="16" fill="#35B6A0" stroke="#172B49" stroke-opacity="0.12" />
    <text x="190" y="151" font-size="16" font-weight="600">青绿</text>
    <text x="190" y="175" font-size="13">brand_teal</text>
    <text x="190" y="198" font-size="14">#35B6A0</text>
    <rect x="360" y="24" width="150" height="100" rx="16" fill="#F2A65A" stroke="#172B49" stroke-opacity="0.12" />
    <text x="360" y="151" font-size="16" font-weight="600">暖橙</text>
    <text x="360" y="175" font-size="13">brand_orange</text>
    <text x="360" y="198" font-size="14">#F2A65A</text>
    <rect x="530" y="24" width="150" height="100" rx="16" fill="#F5F7FA" stroke="#172B49" stroke-opacity="0.12" />
    <text x="530" y="151" font-size="16" font-weight="600">雾白</text>
    <text x="530" y="175" font-size="13">brand_mist</text>
    <text x="530" y="198" font-size="14">#F5F7FA</text>
  </g>
</svg>
