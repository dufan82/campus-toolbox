name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: JVM tests, lint and APK checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Install required Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'

      - name: Test portable build entry point
        shell: pwsh
        run: ./scripts/Test-Build.ps1

      - name: Run tests, lint and assemble
        run: ./gradlew --no-daemon --console=plain :watermark-core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease

      - name: Test local release preparation
        shell: pwsh
        run: |
          Write-Output 'Release validation uses Android Build Tools 35.0.0.'
          ./scripts/Test-Release.ps1 -BuildToolsPath (Join-Path $env:ANDROID_HOME 'build-tools/35.0.0')

      - name: Upload test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-check-reports-${{ github.run_id }}
          path: |
            watermark-core/build/reports/tests/
            watermark-core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CI debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: campus-toolbox-ci-debug-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
